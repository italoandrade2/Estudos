<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>HTML com Semântica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Site</h1>
        <p>Meu site semântico e estilizado com <strong>CSS</strong>.</p>

        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#tecnologias">Tecnologias</a></li>
                <li><a href="#novidades">Novidades</a></li>
            </ul>
        </nav>
    </header> 
    
    <hr>

    <main>
        <section id="sobre">
            <h2>Sobre Mim</h2>
            <p>Esse texto está dentro de uma <em>Section</em>.</p>
            
            <figure>
                <img src="https://st.depositphotos.com/1001890/2235/i/450/depositphotos_22353557-stock-photo-smiling-cute-baby.jpg" alt="Minha foto">
            </figure>
        </section>

        <section id="tecnologias">
            <h2>Lista de Tecnologias</h2>
            <article class="bloco-de-texto">
                <h3>Front-End</h3>
                <ul>
                    <li>HTML5</li>
                    <li>CSS3</li>
                </ul>
            </article>
        </section>

        <section id="novidades">
            <h2>Receba Novidades</h2>
            <p>Inscreva-se para receber atualizações sobre meus projetos.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Dados para inscrição</legend>
                    <label for="nome">Nome completo: </label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    <br><br>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    <br><br>
                    <label for="phone">Telefone:</label>
                    <input type="tel" id="phone" name="phone" placeholder="(xx) xxxxx-xxxx" pattern="[0-9]{11}" required>
                    <br><br>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                    <br><br>
                    <label for="genero">Gênero:</label>
                    <input type="text" list="genero" placeholder="Gênero" required>
                    <datalist id="genero">
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Prefiro não informar">Prefiro não informar</option>
                    </datalist>
                    <br><br>
                    <button type="submit">Inscrever-se</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
