<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exemplo HTML Com Semântica</title>
</head>
<body>

    <header>
        <h1>Meu Site</h1>
        <p>Um exemplo de página com <strong>semântica</strong>.</p>
        
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        
        <section id="sobre">
            <h2>Sobre Mim</h2>
            <p>Este texto está dentro de uma <em>section</em>.</p>
            <figure>
                <img src="https://st.depositphotos.com/1001890/2235/i/450/depositphotos_22353557-stock-photo-smiling-cute-baby.jpg" alt="Minha foto">
            </figure>
        </section>

        <br>

        <section id="tecnologias">
            <h2>Lista de Tecnologias</h2>
            <article class="bloco-de-texto">
                <h3>Front-End</h3>
                <ul>
                    <li>HTML (versões antigas)</li>
                    <li>CSS</li>
                </ul>
            <article>
        </section>

    </main>

    <hr>

    <footer>
        <p>Copyright 2026</p>
    </footer>

</body>
</html>
