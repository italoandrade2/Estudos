<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <header>
        <h1>Cadastro</h1>
        <p>Preencha os campos abaixo para realizar seu cadastro:</p>
    </header>

    <main>
        <form>
            <fieldset>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                <br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                <br><br>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <br><br>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Digite sua idade">
                <br><br>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
                <br><br>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(xx) xxxxx-xxxx" pattern="\([1-9]{2}\)\s?[2-9][0-9]{3,4}-[0-9]{4}">
                <br><br>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </main>

    <footer>©2026 - Italo Andrade Costa (italoandradecosta5@gmail.com)</footer>
</body>
</html>
