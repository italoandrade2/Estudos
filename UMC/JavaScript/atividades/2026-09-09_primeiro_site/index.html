<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Primeiro JavaScript</h1>
        <p>Primeira aula prática</p>
    </header>
    <main>
        <section class="card">
            <h2>Olá, aluno do prof. Flávio!</h2>
            <p id="mensagem">Digite seu nome e clique no botão.</p>

            <input type="text" id="nome" placeholder="Digite seu nome">

            <button id="btnSaudacao">Dizer olá</button>
        </section>

        <section class="card">
            <h2>Contador</h2>
            <p id="contador">0</p>
            <button id="btnDiminuir">-</button>
            <button id="btnAumentar">+</button>
            <button id="btnZerar">Zerar</button>
        </section>

        <section class="card">
            <h2>Mudar a cor</h2>
            <p id="textoCor">Clique no botão para mudar a cor.</p>
            <button id="btnCor">Mudar cor</button>
        </section>
    </main>
    <footer>
        <p>Desenvolvimento Web - JavaScript</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
