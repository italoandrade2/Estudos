<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Primeiro JavaScript</h1>
        <p>Primeira aula prática</p>
    </header>
    <main>
        <section class="card">
            <h2>Olá, aluno do prof. Flávio!</h2>
            <p id="mensagem">Digite seu nome e clique no botão.</p>

            <input type="text" id="nome" placeholder="Digite seu nome">

            <button id="btnSaudacao">Dizer olá</button>
        </section>

        <section class="card">
            <h2>Contador</h2>
            <p id="contador">0</p>
            <button id="btnDiminuir">-</button>
            <button id="btnAumentar">+</button>
            <button id="btnZerar">Zerar</button>
        </section>

        <section class="card">
            <h2>Mudar a cor</h2>
            <p id="textoCor">Clique no botão para mudar a cor.</p>
            <button id="btnCor">Mudar cor</button>
        </section>

        <section class="card">
            <h2>Calculadora</h2>
            <p id="etapaAtual">Digite o primeiro número:</p>
            <p id="calculo">0</p>
            <p id="numeros">Números:</p>
            <button id="btnNum1">1</button>
            <button id="btnNum2">2</button>
            <button id="btnNum3">3</button>
            <button id="btnNum4">4</button>
            <button id="btnNum5">5</button>
            <button id="btnNum6">6</button>
            <button id="btnNum7">7</button>
            <button id="btnNum8">8</button>
            <button id="btnNum9">9</button>
            <button id="btnNum0">0</button>
            <p id="operacoes">Operações</p>
            <button id="btnSomar">+</button>
            <button id="btnSubtrair">-</button>
            <button id="btnIgual">Resultado</button>
            <button id="btnReiniciar">Reiniciar</button>
        </section>
    </main>
    <footer>
        <p>Desenvolvimento Web - JavaScript</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
